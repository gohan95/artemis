<!doctype html>
<html><head><title>Product Engineer | Example Co</title></head><body>
<main>
  <h1>Product Engineer</h1>
  <div class="posting-page">
    <div class="posting-description"><p>Help customers solve hard problems.</p></div>
    <form class="application-form">
      <label for="name">Full Name</label><input id="name" name="name" required>
      <label for="email">Email</label><input id="email" name="email" type="email" required>
      <label for="authorization">Work authorization</label>
      <select id="authorization" name="authorization" required><option value="">Select</option><option>Yes</option><option>No</option></select>
      <fieldset><legend>Remote work</legend>
        <label><input type="checkbox" name="remote" value="yes"> Yes</label>
      </fieldset>
      <label for="resume">Resume</label><input id="resume" type="file" name="resume">
      <label for="note">Additional information</label><textarea id="note" name="note"></textarea>
      <button type="submit">Submit application</button>
      <p class="error" role="alert" hidden>This field is required.</p>
    </form>
    <div class="application-confirmation" hidden>Thanks for your application</div>
  </div>
</main>
<script>
document.querySelector('form').addEventListener('submit', event => {
  event.preventDefault();
  document.querySelector('[role=alert]').hidden = false;
});
</script>
</body></html>
