<!doctype html>
<html><head><title>Senior Engineer at Example</title></head><body>
<main>
  <h1>Senior Engineer</h1>
  <section id="job-description"><p>Build useful software with a kind team.</p></section>
  <form id="application-form">
    <label>Full Name <input name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Work authorization
      <select name="authorization" required><option value="">Choose</option><option>Yes</option><option>No</option></select>
    </label>
    <fieldset><legend>Remote work</legend>
      <label><input type="checkbox" name="remote" value="yes"> Yes</label>
    </fieldset>
    <label>Resume <input type="file" name="resume" accept=".pdf"></label>
    <label>Why this role? <textarea name="why"></textarea></label>
    <button type="submit">Submit Application</button>
    <p role="alert" id="validation-error" hidden>Please correct the highlighted fields.</p>
  </form>
  <div id="confirmation" hidden>Thank you for applying</div>
</main>
<script>
document.querySelector('form').addEventListener('submit', event => {
  event.preventDefault();
  document.querySelector('#validation-error').hidden = false;
});
</script>
</body></html>
