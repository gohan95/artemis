[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artemis"
version = "0.1.0"
description = "A personal AI assistant for job hunting: fills and submits curated job applications"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    # Drop-in, undetected Playwright fork -- the only browser engine this
    # project uses. See src/artemis/browser.py for why (it patches
    # automation tells stock Playwright cannot, at the CDP/launch-args
    # layer). Its API surface is Playwright's, so no separate `playwright`
    # dependency is needed alongside it.
    "patchright>=1.63,<1.64",
]

[project.scripts]
artemis = "artemis.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/artemis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
