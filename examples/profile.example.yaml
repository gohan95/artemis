# Fictional example only. Replace values only with facts you can support from your records.
# Required: resume_path must point to an existing, readable PDF. All other fields are optional.
full_name: Riley Example
email: riley@example.test
phone: "+1-555-010-2040"
location: Portland, OR
website: https://riley.example.test
linkedin: https://www.linkedin.com/in/riley-example

# Relative paths are resolved from the directory containing this YAML file.
resume_path: resume.pdf

# Keep record IDs stable if you reorder or edit these entries.
work_history:
  - id: northstar-analytics
    employer: Northstar Analytics
    title: Data Analyst
    start_date: 2022-04
    end_date: 2025-01
    achievements:
      - Built reporting tools used by four internal teams
      - Improved a weekly data quality review process

education:
  - id: cascades-college
    institution: Cascades College
    degree: BS in Statistics
    graduation_year: 2021

skills:
  - SQL
  - Python
  - Data visualization

# Recurring logistics questions the resume doesn't answer -- set once here,
# reused across applications, filled in only when a form actually asks. An
# unset field here just falls through to a normal prompt, unlike `declared`
# below.
preferences:
  locations:
    - Remote
    - Portland, OR
  employment_types:
    - Full-time
  salary_expectation: "150-170k"
  desired_start_date: "2 weeks notice"
  notice_period: "2 weeks"
  willing_to_relocate: false
  remote_preference: remote

# Protected/legally-significant facts (work authorization, sponsorship, disability,
# veteran status, criminal history, demographics, ...). Once declared here, a value
# fills and submits automatically like any other field above -- there is no separate
# per-application review for these. What's protected is that a value here is never
# derived from anything else: never inferred from another field, never matched
# across categories, never learned from a live prompt. An undeclared key always
# defers the application rather than guessing. "Prefer not to say" is a perfectly
# valid declared value where a form allows it.
declared:
  work_authorization: "Yes"
  sponsorship: "No"
  veteran_status: "I am not a veteran"
  disability: "Prefer not to say"
  gender: "Prefer not to say"
  race_ethnicity: "Prefer not to say"
